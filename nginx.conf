# Static server for the single-file build (dist/index.html).
# Serves / from the bundle; unknown paths fall back to it, preserving the
# current behaviour without adding any routing.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
